<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body class="bg-dark d-flex justify-content-center align-items-center vh-100">

	<div class="container p-5">
		<div class="row">
			<div class="col-md-6 offset-md-3">
				 <div class="card" style="width: 500px;">
						<div class="card-header bg-dark text-white">
							<h2 class="text-center">Login Form</h2>
						</div>
						<div class="card-body bg-blue text-white">
						<form action="login" method="post">
							<div class="form-group text-center text-dark">
								<label>Email</label><br> <input required type="text"
									name="email" placeholder="Enter Email Here"><br> <br>
							</div>
							<div class="form-group text-center text-dark">
								<label>Password</label><br> <input required type="text"
									name="password" placeholder="Enter Password Here"><br> <br>
							</div>
                            <div class="text-center">
							<button type="submit" class="col-md-4 btn btn-success">Login</button>
                            </div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
